<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap"
      rel="stylesheet"
    />

    <title>Home</title>

    <link rel="stylesheet" href="./assets/css/index.css" />
    <script
      src="https://kit.fontawesome.com/ff53e92e9d.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="dark bg-[#141414] text-white">
    <div class="podcast-page relative">
      <input type="checkbox" name="menu" id="menu-toggle" class="peer hidden" />
      <label
        for="menu-toggle"
        class="overlay fixed inset-0 z-[998] bg-black/60 cursor-pointer opacity-0 invisible transition-all duration-300 ease-in-out peer-checked:opacity-100 peer-checked:visible lg:hidden"
      ></label>
      <div>
        <a
          href="#!"
          class="top-banner block bg-[#141414] flex justify-center items-center pt-10 px-6 pb-3.5 gap-2.5 lg:py-3 lg:px-6 2xl:px-6 2xl:py-5"
        >
          <p
            class="top-banner__text text-[#98989A] text-xs font-['Inter'] font-normal leading-[150%] tracking-[-0.03em] lg:text-sm lg:py-3 lg:px-6 2xl:text-lg"
          >
            Subscribe to our Newsletter For Blogs and Resources
          </p>

          <span class="icon inline-block flex">
            <img
              class="w-5 h-5 2xl:w-6 2xl:h-6"
              src="./assets/img/index/Icon.svg"
              alt="icon"
            />
          </span>
        </a>
      </div>
      <!-- header -->
      <header
        class="sticky top-0 left-0 z-[1000] peer-checked:[&_.nav]:right-0 peer-checked:[&_.close]:block header w-full"
      >
        <div
          class="navbar px-4 py-5 bg-[#1A1A1A] border-y border-[#262626] flex justify-between items-center lg:px-20 lg:py-5 lg:border-b lg:border-t-0 2xl:px-40.5 2xl:py-6 2xl:border-b 2xl:border-t-0"
        >
          <a href="#!" class="logo inline-block flex items-center">
            <img
              class="w-[125.23px] h-8.75 lg:w-[143.12px] lg:h-[40px] 2xl:w-[178.91px] 2xl:h-[50px]"
              src="./assets/img/index/logo_podcast.svg"
              alt="logo"
            />
          </a>
          <!-- nav -->
          <nav
            class="nav fixed top-0 -right-75 z-[1000] pt-26 px-5 lg:pt-0 lg:px-0 w-75 h-screen border-l border-[#262626] lg:border-l-0 bg-[#1A1A1A] border-[#262626] lg:border-l-0 transition-all duration-300 ease-in-out lg:block lg:static lg:w-auto lg:h-auto lg:bg-transparent 2xl:block 2xl:static"
          >
            <ul
              class="nav__list flex flex-col lg:flex-row 2xl:flex-row gap-6 rounded-xl 2xl:gap-10"
            >
              <li class="">
                <a
                  class="block transition-all duration-300 ease hover:bg-[#141414] rounded-[10px] hover:border hover:border-[#fff] px-2 py-4 lg:border-b-0 border-b border-[#262626] font-['Inter'] font-medium tracking-0 lg:py-2.5 lg:px-4.5 lg:text-sm lg:hover:bg-[#141414] lg:hover:border lg:hover:border-[#333333] lg:hover:rounded-lg 2xl:text-lg 2xl:py-3.5 2xl:px-6"
                  href="./index.html"
                >
                  Home
                </a>
              </li>

              <li class="">
                <a
                  class="block transition-all duration-300 ease hover:bg-[#141414] rounded-[10px] hover:border hover:border-[#fff] px-2 py-4 lg:border-b-0 border-b border-[#262626] font-['Inter'] font-medium tracking-0 lg:py-2.5 lg:px-4.5 lg:text-sm lg:hover:bg-[#141414] lg:hover:border lg:hover:border-[#333333] lg:hover:rounded-lg 2xl:text-lg 2xl:py-3.5 2xl:px-6"
                  href="./pages/news.html"
                >
                  News
                </a>
              </li>

              <li class="">
                <a
                  class="block transition-all duration-300 ease hover:bg-[#141414] rounded-[10px] hover:border hover:border-[#fff] px-2 py-4 lg:border-b-0 border-b border-[#262626] font-['Inter'] font-medium tracking-0 lg:py-2.5 lg:px-4.5 lg:text-sm lg:hover:bg-[#141414] lg:hover:border lg:hover:border-[#333333] lg:hover:rounded-lg 2xl:text-lg 2xl:py-3.5 2xl:px-6"
                  href="./pages/podcast.html"
                >
                  Podcasts
                </a>
              </li>

              <li class="">
                <a
                  class="block transition-all duration-300 ease hover:bg-[#141414] rounded-[10px] hover:border hover:border-[#fff] px-2 py-4 lg:border-b-0 border-b border-[#262626] font-['Inter'] font-medium tracking-0 lg:py-2.5 lg:px-4.5 lg:text-sm lg:hover:bg-[#141414] lg:hover:border lg:hover:border-[#333333] lg:hover:rounded-lg 2xl:text-lg 2xl:py-3.5 2xl:px-6"
                  href="#!"
                >
                  Resources
                </a>
              </li>
              <li class="lg:hidden">
                <a
                  href="#!"
                  class="block transition-all duration-300 ease hover:opacity-80 mt-6 text-center bg-[#FFD11A] text-[#141414] font-medium rounded-lg py-3"
                >
                  Contact Us
                </a>
              </li>
            </ul>
          </nav>

          <div class="header__active">
            <a
              href="#!"
              class="hidden lg:inline-block font-sans text-[#141414] font-medium lg:text-sm leading-normal tracking-normal whitespace-nowrap transition-transform duration-300 ease-in-out hover:scale-110 bg-[#FFD11A] lg:py-2.5 lg:px-3.5 lg:rounded-md 2xl:text-base 2xl:py-3.5 2xl:px-5"
            >
              Contact Us
            </a>

            <label
              for="menu-toggle"
              class="header__hamburger transition-scale duration-300 ease hover:scale-110 lg:hidden cursor-pointer peer-checked:hidden p-1 text-white text-2xl flex items-center"
            >
              <img class="w-8.5 h-8.5" src="./assets/img/index/menu.svg" alt="menu" />
            </label>
            <label
              for="menu-toggle"
              class="close fixed transition-scale duration-300 ease hover:scale-120 top-0 right-0 p-10 z-[1001] hidden cursor-pointer"
            >
              <img class="w-8.5 h-8.5" src="./assets/img/index/x-mark.svg" alt="close" />
            </label>
          </div>
        </div>
      </header>
    </div>
  </body>
</html>
